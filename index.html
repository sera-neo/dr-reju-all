<style>
  :root {
    --milk: #fbf6ef;
    --cream: #f3e9dc;
    --latte: #e6d3bf;
    --sand: #d4b99c;
    --mocha: #a5826a;
    --cocoa: #6f5242;
    --espresso: #4a372c;
    --white: #fffdf9;
    --shadow: 0 10px 30px -12px rgba(111, 82, 66, .28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    font-family: "Jost", system-ui, sans-serif;
    color: var(--espresso);
    background:
      radial-gradient(circle at 15% 10%, rgba(230, 211, 191, .65) 0, transparent 45%),
      radial-gradient(circle at 90% 85%, rgba(212, 185, 156, .45) 0, transparent 50%),
      var(--milk);
    display: flex;
    justify-content: center;
    padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }

  .badge {
    width: 104px; height: 104px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--white), var(--latte));
    border: 1px solid rgba(165, 130, 106, .25);
    box-shadow: var(--shadow), inset 0 2px 6px rgba(255,255,255,.9);
    display: grid; place-items: center;
    font-family: "Cormorant Garamond", serif;
    font-size: 38px; font-weight: 600; font-style: italic;
    color: var(--cocoa);
    letter-spacing: -1px;
    overflow: hidden;
  }
  .logo { line-height: 0; }
  .logo img {
    width: 100%;
    max-width: 300px;
    height: auto;
    /* blends the logo's white background into the cream page */
    mix-blend-mode: multiply;
  }
  h1 {
    font-family: "Cormorant Garamond", serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: .5px;
    color: var(--espresso);
  }
  .tagline {
    margin-top: 10px;
    font-family: "Cormorant Garamond", serif;
    font-style: italic;
    font-weight: 500;
    font-size: 19px;
    letter-spacing: .3px;
    color: var(--cocoa);
  }
  .divider {
    width: 48px; height: 1px;
    background: var(--sand);
    margin: 26px auto 30px;
  }

  .links { display: flex; flex-direction: column; gap: 14px; }
  .link {
    display: flex; align-items: center; gap: 14px;
    padding: 16px 20px;
    border-radius: 18px;
    text-decoration: none;
    color: var(--espresso);
    background: var(--white);
    border: 1px solid rgba(165, 130, 106, .22);
    box-shadow: 0 4px 14px -8px rgba(111, 82, 66, .25);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
  }
  .link:hover, .link:focus-visible {
    transform: translateY(-2px);
    box-shadow: var(--shadow);
    background: #fffaf3;
    outline: none;
  }
  .link:focus-visible { border-color: var(--mocha); }
  .icon {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 12px;
    display: grid; place-items: center;
    background: var(--cream);
    color: var(--cocoa);
  }
  .icon svg { width: 21px; height: 21px; }
  .icon.photo {
    width: 60px; height: 60px;
    border-radius: 14px;
    overflow: hidden;
    background: var(--cream);
  }
  .icon.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .text { flex: 1; text-align: left; min-width: 0; }
  .text strong { display: block; font-weight: 500; font-size: 16px; }
  .text span { display: block; font-size: 12.5px; font-weight: 300; color: var(--mocha); margin-top: 2px; }
  .arrow { flex: none; color: var(--sand); transition: transform .2s ease, color .2s ease; }
  .link:hover .arrow { transform: translateX(3px); color: var(--cocoa); }

  /* Shop link — featured */
  .link.featured {
    background: linear-gradient(135deg, #b8957b, var(--cocoa));
    color: var(--white);
    border-color: transparent;
    padding: 20px 22px;
    box-shadow: 0 14px 30px -14px rgba(74, 55, 44, .55);
  }
  .link.featured:hover { background: linear-gradient(135deg, #ad8a70, #634838); }
  .link.featured .icon { background: var(--white); color: var(--espresso); }
  .link.featured .icon svg { width: 26px; height: 26px; }
  .link.featured .text strong { font-size: 17px; }
  .link.featured .text span { color: #f3e4d4; }
  .link.featured .arrow { color: #f3e4d4; }
  .link.featured:hover .arrow { color: var(--white); }

  .section-label {
    margin: 18px 0 2px;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--mocha);
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    font-weight: 300;
    color: var(--mocha);
    letter-spacing: 1px;
  }
</style>
